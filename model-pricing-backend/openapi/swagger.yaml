  /api/internal/quotes/expiring:
    get:
      description: 返回 status=EFFECTIVE 且 valid_to ≤ now+days 的报价单。grace_until 实时算（valid_to+quote_grace_days，不写列）。single_point=该单内是否有
        SKU 只有这一家有效报价（跨供应商计数）。alert_level：days>7→NORMAL；0~7→HIGH；过期未过宽限→URGENT；过宽限未确认→URGENT+pending_remove；单点依赖阈值提前至
        14/7 且级别升一级。
      parameters:
      - default: 7
