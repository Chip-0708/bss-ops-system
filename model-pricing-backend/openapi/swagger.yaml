        in: query
        name: days
        type: integer
      - description: 只看单点依赖
        in: query
        name: only_single_point
        type: boolean
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M4:V
          schema:
            $ref: '#/definitions/api.APIResponse'
