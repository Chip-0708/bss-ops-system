  /api/internal/quotes/retro-effective:
    post:
      consumes:
      - application/json
      description: 集合路径 + supplier_id 入体（5d 裁决 1）。effective_time 必须过去；audit_reason
        ≥10 字（按 rune）；创建即 APPROVED_PENDING 并立即激活（复用 §10 ActivateDueQuotes，同事务关闭旧 EFFECTIVE）；COST_RECALC
        payload 带 effective_time（绝不向更早回灌）。激活失败写 alert(QUOTE_ACTIVATE_FAILED) 并返回明确错误。当月补录超
        retro_monthly_limit(5) 写 RETRO_LIMIT alert。撞 uk_quote_pending → 409 并带出阻塞单号与版本号。
      parameters:
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: '{supplier_id, effective_time, valid_to, audit_reason, items}'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/supplier.RetroEffectiveInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={id,status,retroactive,closed_previous_id,cost_recalc_queued,retro_count_this_month,alert_created}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法 / 未来时间 / 理由不足
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M4:P
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 供应商不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
