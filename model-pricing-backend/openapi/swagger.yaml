    post:
      consumes:
      - application/json
      description: decision ∈ {FOLLOW, NOT_FOLLOW}。FOLLOW：仅置 status=FOLLOWED（不自动发布价目表——裁决
        7 待 8b-3）；NOT_FOLLOW 且当前售价 < floor → 409（须走特价审批）；非 PENDING 行 → 409；不存在 → 404。
      parameters:
      - description: 队列行 id
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: decision 必填；override_price / reason 可选
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.decideBody'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={queue_id,status,decided_by,decided_at,override_price?}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法 / decision 非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M7:E
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 队列行不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 非 PENDING / NOT_FOLLOW 低于 floor
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 涨价传导决策（M7:E + 幂等必填 Idempotency-Key；双人通过 apply）
      tags:
