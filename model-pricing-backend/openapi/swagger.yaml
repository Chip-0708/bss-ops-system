  /api/internal/price-upconduction:
    get:
      description: 每行 = 一个 (sku_id, level_code) 在"成本上涨"时生成的待决策项。cost_before/cost_after
        为成本基线前/后版本 unit_cost；price_current 为该 level 当前 EFFECTIVE 价目表代表组件售价；price_suggested
        = price_current × (1 + cost_delta_pct)；floor_price = cost_after / (1 - min_gross_margin)；margin_before/margin_after
        按 field_mask 剔除（SALES 不可得）；status ∈ {PENDING, FOLLOWED, NOT_FOLLOWED}；frozen_until
        为冻结期，超时 worker 自动 NOT_FOLLOWED。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页（上限 200）
        in: query
        name: size
        type: integer
      - description: 按状态过滤（PENDING / FOLLOWED / NOT_FOLLOWED）
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M7:V
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 涨价传导队列列表（M7:V；margin_* 字段按 field_mask 剔除）
      tags:
      - 定价与价目表
