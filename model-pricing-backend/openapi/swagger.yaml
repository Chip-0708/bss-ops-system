  /api/internal/staging-prices:
    get:
      description: diff_status：NEW（无同币种当前官方价）/ CHANGED / UNCHANGED / UNMATCHED（sku_id=null）。diff_detail
        只含 CHANGED 组件：old_price 为 DB numeric(20,8) 原文（如 "2.50000000"，与录入原文 "2.50"
        数值等价——前端按数值比较，勿按字符串相等）；delta_pct=(new−old)/old 6 位小数，old=0 或 NEW 时为 null。payload
        多出的组件不参与比对。按 id ASC（录入序）分页。
      parameters:
      - description: 按采集批次过滤
        in: query
        name: sync_job_id
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页（上限 100）
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M2:V
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 暂存区列表（M2:V，diff 实时计算）
      tags:
      - 官方价变更
    post:
      consumes:
      - application/json
      description: 逐行校验（sku_id 存在 / raw_sku_code 精确匹配 / currency 3 位 / payload 非空且值合法非负
        decimal），任一行非法整批 400 不落库。sku_id 与 raw_sku_code 二选一（sku_id 优先，都给了忽略 raw_sku_code）；raw_sku_code
        匹配不到 → sku_id=null、match_status=UNMATCHED（只标记，处理策略待产品裁决——遗留 7a-③）。processed
        恒 false（7b confirm 置 true）。diff 不在写入时落库——GET 列表实时计算。
      parameters:
      - description: sync_job_id + items[]（sku_id/raw_sku_code 二选一 + currency + payload）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/price.CreateStagingInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={created_count,staging_ids}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（含幂等键缺失）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M2:E
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 sync_job_id 不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 幂等冲突
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 手工录入采集结果（M2:E，幂等必填 Idempotency-Key）
      tags:
      - 官方价变更
  /api/internal/staging-prices/confirm:
    post:
      consumes:
      - application/json
      description: 校验 staging_ids 非空 / 每条存在且属于该 sync_job 且 processed=false / effective_time≤now（>now→400，预约生效登记为遗留
        7b-①）；同 SKU 多条以 max(staging.id) 胜出；自动判涨跌方向（任一组件 new>old→PRICE_UP 2 步审批 MODEL_OPS→PRICING_OP，否则
        PRICE_DOWN 1 步 MODEL_OPS）；涨价才生成 margin_preview（floor=price×(1+loss)×(1+channel)/(1−min_gross_margin)）。单事务：change_request
        + approval_steps + staging.processed=true。生效连锁（price_version 新版本 / 报价静默跟随
        / COST_RECALC 入队 / official_price.changed 出站 / cache_version+1）在审批全部通过时由 DecideApproval
        回调执行。
      parameters:
      - description: sync_job_id + staging_ids[] + effective_time(RFC3339，≤now)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/price.ConfirmInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={change_request_id,step_count}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（staging_ids 空 / effective_time 未来或非法 / 批次不匹配）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M2:E
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 staging_id 不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 staging 已确认 / 幂等冲突
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 确认入正式版本（M2:E，幂等必填 Idempotency-Key）
      tags:
      - 官方价变更
  /api/internal/workbench/metrics:
    get:
      description: 已认证即可；按的角色裁剪：PROCUREMENT 4 卡（待审批报价/本月生效/30天内到期/单点依赖）、PRICING_OP
        3 卡（待发布价目表/破 floor/成本上涨待决策）、SALES 3 卡（客户/待确认报价/季度成交额占位）、FINANCE 2 卡（汇率锁定占位/押金未付）。多角色取并集。**本接口不返回
        unit_cost/floor_price/margin 等字段**（成本数据只在 service 内部用于破 floor 判定）。
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=MetricsResult{cards[]}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 工作台指标卡（按角色裁剪）
      tags:
      - 工作台
