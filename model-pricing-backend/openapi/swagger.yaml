basePath: /
definitions:
  api.APIResponse:
    properties:
      code:
        description: 业务错误码，0=成功
        example: 0
        type: integer
      data:
        description: 业务数据
        type: object
      message:
        description: 错误消息，成功时 "ok"
        example: ok
        type: string
      requestId:
        description: 请求追踪号（X-Request-Id）
        example: 01929d81-...
        format: uuid
        type: string
    type: object
  api.decideBody:
    properties:
      decision:
        type: string
      override_price:
        type: string
      reason:
        type: string
    required:
    - decision
    type: object
  api.generateDraftBody:
    properties:
      currency:
        type: string
      level_code:
        type: string
      policy_ids:
        items:
          type: integer
        type: array
      sku_ids:
        items:
          type: integer
        type: array
    required:
    - currency
    - level_code
    type: object
  api.generateQuoteBody:
    properties:
      customer_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.quoteItemBody'
        type: array
      quote_type:
        type: string
      source_quote_id:
        type: integer
      valid_to:
        type: string
    required:
    - customer_id
    - quote_type
    type: object
  api.lockPrimaryBody:
    properties:
      reason:
        type: string
      supplier_id:
        type: integer
    type: object
  api.publishBody:
    properties:
      effective_time:
        type: string
      gray_percent:
        type: integer
      mode:
        type: string
    required:
    - effective_time
    - mode
    type: object
  api.quoteItemBody:
    properties:
      sku_id:
        type: integer
      unit_price:
        type: string
    required:
    - sku_id
    type: object
  api.refreshBody:
    properties:
      reason:
        type: string
    type: object
  api.rollbackBody:
    properties:
      reason:
        type: string
      target_version_no:
        type: integer
    required:
    - reason
    - target_version_no
    type: object
  api.specialPriceBody:
    properties:
      expected_margin:
        type: string
      reason:
        type: string
    required:
    - expected_margin
    - reason
    type: object
  api.transferBody:
    properties:
      confirm:
        type: boolean
      reason:
        type: string
      to_operator_id:
        type: integer
    required:
    - to_operator_id
    type: object
  api.upsertPolicyBody:
    properties:
      code:
        type: string
      level_code:
        type: string
      name:
        type: string
      param_value:
        type: string
      price_method:
        type: string
      priority:
        type: integer
      scope_id:
        type: integer
      scope_type:
        type: string
      status:
        type: string
    required:
    - code
    - name
    - param_value
    - price_method
    - scope_type
    - status
    type: object
  auth.LoginRequest:
    properties:
      login_id:
        type: string
      password:
        type: string
    type: object
  cost.OverrideItem:
    properties:
      channel_rate:
        type: string
      loss_rate:
        type: string
      scope_id:
        type: integer
      scope_type:
        type: string
      tax_inclusive:
        type: boolean
      withholding_tax:
        type: string
    type: object
  cost.ParamViewCost:
    properties:
      channel_rate:
        type: string
      loss_rate:
        type: string
      tax_inclusive:
        type: boolean
      withholding_tax:
        type: string
    type: object
  cost.PutParamsInput:
    properties:
      defaults:
        allOf:
        - $ref: '#/definitions/cost.ParamViewCost'
        description: 6d-2 只读：非 nil → 400
      overrides:
        items:
          $ref: '#/definitions/cost.OverrideItem'
        type: array
    type: object
  model.AliasInput:
    properties:
      aliases:
        items:
          type: string
        type: array
      source:
        type: string
    required:
    - aliases
    type: object
  model.BatchInput:
    properties:
      action:
        type: string
      payload:
        additionalProperties: true
        type: object
      sku_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - action
    - sku_ids
    type: object
  model.CreateSKUInput:
    properties:
      aliases:
        items:
          type: string
        type: array
      capability:
        additionalProperties: true
        type: object
      context_window:
        type: integer
      cross_border:
        type: boolean
      family_id:
        type: integer
      is_sensitive:
        type: boolean
      model_type:
        type: string
      native_currency:
        type: string
      sku_code:
        maxLength: 128
        minLength: 1
        type: string
      tier_tag:
        type: string
      vendor_id:
        type: integer
    required:
    - family_id
    - model_type
    - native_currency
    - sku_code
    - vendor_id
    type: object
  model.DecisionInput:
    properties:
      comment:
        maxLength: 512
        type: string
      decision:
        enum:
        - APPROVED
        - REJECTED
        type: string
      step_no:
        type: integer
    required:
    - decision
    - step_no
    type: object
  model.DeprecateInput:
    properties:
      impact_snapshot_id:
        type: string
      reason:
        maxLength: 500
        minLength: 1
        type: string
      replacement_sku_id:
        type: integer
      sunset_date:
        type: string
    required:
    - impact_snapshot_id
    - reason
    - sunset_date
    type: object
  model.MergeInput:
    properties:
      alias:
        maxLength: 128
        minLength: 1
        type: string
      source_sku_id:
        type: integer
      target_sku_id:
        type: integer
    required:
    - alias
    - source_sku_id
    - target_sku_id
    type: object
  model.UpdateSKUInput:
    properties:
      aliases:
        items:
          type: string
        type: array
      capability:
        additionalProperties: true
        type: object
      context_window:
        type: integer
      cross_border:
        type: boolean
      is_sensitive:
        type: boolean
      model_type:
        type: string
      native_currency:
        type: string
      sku_code:
        type: string
      tier_tag:
        type: string
    type: object
  price.ConfirmInput:
    properties:
      effective_time:
        description: RFC3339，只允许 ≤now
        type: string
      staging_ids:
        items:
          type: integer
        type: array
      sync_job_id:
        type: integer
    required:
    - effective_time
    - staging_ids
    - sync_job_id
    type: object
  price.CreateJobInput:
    properties:
      job_type:
        type: string
      sku_ids:
        items:
          type: integer
        type: array
      source:
        type: string
    type: object
  price.CreateStagingInput:
    properties:
      items:
        items:
          $ref: '#/definitions/price.StagingItemInput'
        type: array
      sync_job_id:
        type: integer
    type: object
  price.StagingItemInput:
    properties:
      currency:
        type: string
      payload:
        additionalProperties: {}
        type: object
      raw_sku_code:
        type: string
      sku_id:
        type: integer
    type: object
  supplier.ApplicationDecisionInput:
    properties:
      action:
        description: APPROVE / MERGE / REJECT
        type: string
      reason:
        description: REJECT 时必填
        type: string
      target_sku_id:
        description: |-
          TargetSKUID APPROVE / MERGE 时必填：指向已存在的 model_sku。
            APPROVE → 该 SKU 是为本申请新建/对应的 SKU
            MERGE   → 被合并到的已有 SKU
        type: integer
    type: object
  supplier.ConfirmRemoveInput:
    properties:
      confirm:
        type: boolean
      reason:
        type: string
    type: object
  supplier.RejectInput:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  supplier.RetroEffectiveInput:
    properties:
      audit_reason:
        type: string
      effective_time:
        type: string
      items:
        items:
          $ref: '#/definitions/supplier.SubmitQuoteItem'
        type: array
      supplier_id:
        type: integer
      valid_to:
        type: string
    required:
    - audit_reason
    - effective_time
    - items
    - supplier_id
    - valid_to
    type: object
  supplier.SubmitApplicationInput:
    type: object
  supplier.SubmitQuoteComponent:
    properties:
      component_type:
        type: string
      multiplier:
        type: string
      unit_price:
        type: string
    required:
    - component_type
    - unit_price
    type: object
  supplier.SubmitQuoteInput:
    properties:
      items:
        items:
          $ref: '#/definitions/supplier.SubmitQuoteItem'
        type: array
      remark:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    required:
    - items
    - valid_from
    - valid_to
    type: object
  supplier.SubmitQuoteItem:
    properties:
      components:
        items:
          $ref: '#/definitions/supplier.SubmitQuoteComponent'
        type: array
      constraints:
        additionalProperties: {}
        type: object
      fx_tier:
        type: string
      sku_id:
        type: integer
    required:
    - components
    - sku_id
    type: object
  workbench.AlertActionInput:
    properties:
      action:
        enum:
        - HANDLE
        - RESOLVE
        - IGNORE
        - TO_TICKET
        type: string
      alert_id:
        type: integer
      create_todo:
        type: boolean
      note:
        type: string
    required:
    - action
    - alert_id
    type: object
info:
  contact:
    name: 后端
  description: |-
    大模型中转平台：模型数据中心 + 进货/出货两条定价线。统一响应包 {code,message,data,requestId}；金额一律字符串传输；时间 ISO 8601 带时区。
    错误码：400 参数校验、401 未认证、403 无权限、409 幂等/状态冲突、423 主体冻结、429 限流。
    写操作（产生业务新版本/影响资金合同）必须携带 Idempotency-Key 头。
    分页：?page=1&size=20 或 ?cursor=&size=，统一返回 {list,total,page,size}。
  title: 模型管理与定价中心 API
  version: "0.1"
paths:
  /api/customer/auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登录。成功返回 token（明文仅在响应中出现一次，服务端只存 sha256）与权限包快照 role_snapshot。连续失败
        5 次锁定 15 分钟（429）；主体冻结返回 423。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={token, snapshot}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数校验失败
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 账号或密码错误
          schema:
            $ref: '#/definitions/api.APIResponse'
        "423":
          description: code=10006 主体已冻结
          schema:
            $ref: '#/definitions/api.APIResponse'
        "429":
          description: code=10007 失败次数超限，锁定 15 分钟
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: 登录（三门户共用，portal 由路由前缀决定）
      tags:
      - 认证
  /api/customer/auth/logout:
    post:
      consumes:
      - application/json
      description: 按 Authorization 头中的 Bearer token 吊销会话（revoked=true）。成功返回 204 无响应体。
      produces:
      - application/json
      responses:
        "204":
          description: 会话已吊销
        "401":
          description: code=10002 未携带或非法 token
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 登出（吊销当前会话）
      tags:
      - 认证
  /api/customer/billing:
    get:
      description: 从 customer_profile 读 credit_limit / credit_used / deposit_amount
        / deposit_status / billing_cycle。账单明细 bills=[] 占位（9c-① 遗留：待计费系统接入）。
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalBillingView{credit_limit, credit_used, deposit_amount,
            deposit_status, billing_cycle, bills}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 客户不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 余额 / 授信占用 / 押金状态
      tags:
      - 客户门户
  /api/customer/home:
    get:
      description: balance（与 /billing 同源）+ pending_count（DRAFT/PENDING 报价数）+ unread_notifications
        + common_models（本等级生效价目表的 SKU 列表，**不含价格明细以外的成本/毛利字段**）。本批单接口聚合，9c-④ 登记是否拆分为并行请求。
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalHomeView{balance, pending_count, unread_notifications,
            common_models}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 客户不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: H5 首页聚合：余额 + 待处理 + 未读通知 + 常用模型
      tags:
      - 客户门户
  /api/customer/notifications:
    get:
      description: 当前客户的通知（created_at DESC 分页）。标记已读接口 POST /notifications/{id}/read
        登记 9c-② 遗留。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalNotificationListResult{list, total, page,
            size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 通知列表
      tags:
      - 客户门户
  /api/customer/price-book:
    get:
      description: 按当前登录客户的 level_code 返回当前 EFFECTIVE 价目表（联 model_sku + 代表组件 unit_price）。**不含
        floor_price / unit_cost / margin / baseline**。
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalPriceBookView{level_code, version_no, currency,
            items[]}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 当前等级暂无生效价目表 / 客户不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 当前生效价目表（本等级，分币种）
      tags:
      - 客户门户
  /api/customer/quotes:
    get:
      description: 返回当前客户的 customer_quote（按 id DESC 分页）+ customer_price_book（合同价，SourceKind=CONTRACT）联合列表。只含自己的报价（行级过滤）。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalQuoteListResult{list, total, page, size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 我的报价与合同
      tags:
      - 客户门户
  /api/customer/quotes/{id}/accept:
    post:
      consumes:
      - application/json
      description: 报价必须是 APPROVED 状态（或 special_price_status='APPROVED' 的特价单）且未过 valid_until；行级过滤
        customer_id=登录客户。单事务：customer_quote.status→EFFECTIVE + INSERT customer_price_book
        + audit CUSTOMER_QUOTE_ACCEPTED。
      parameters:
      - description: customer_quote.id
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=PortalAcceptResult{quote_id, new_status, contract_cnt}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 报价不存在（或不是自己的报价）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 报价非 APPROVED / 报价已过期
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 接受报价 → 转合同价（幂等）
      tags:
      - 客户门户
  /api/internal/approvals/{id}/decision:
    post:
      consumes:
      - application/json
      description: 角色匹配 required_role；同一操作员不得完成同一单的两个步骤；两步 APPROVED → SKU 转 DEPRECATING。
      parameters:
      - description: change_request ID
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 审批参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DecisionInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={change_request_id,step_no,decision,final_status}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法 / 自审
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 角色不匹配
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 审批单不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 并发冲突
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 审批动作
      tags:
      - 模型管理
  /api/internal/auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登录。成功返回 token（明文仅在响应中出现一次，服务端只存 sha256）与权限包快照 role_snapshot。连续失败
        5 次锁定 15 分钟（429）；主体冻结返回 423。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={token, snapshot}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数校验失败
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 账号或密码错误
          schema:
            $ref: '#/definitions/api.APIResponse'
        "423":
          description: code=10006 主体已冻结
          schema:
            $ref: '#/definitions/api.APIResponse'
        "429":
          description: code=10007 失败次数超限，锁定 15 分钟
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: 登录（三门户共用，portal 由路由前缀决定）
      tags:
      - 认证
  /api/internal/auth/logout:
    post:
      consumes:
      - application/json
      description: 按 Authorization 头中的 Bearer token 吊销会话（revoked=true）。成功返回 204 无响应体。
      produces:
      - application/json
      responses:
        "204":
          description: 会话已吊销
        "401":
          description: code=10002 未携带或非法 token
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 登出（吊销当前会话）
      tags:
      - 认证
  /api/internal/change-requests:
    get:
      description: 官方价变更单与价目表发布进度统一查询。type 取值：DEPRECATE / PRICE_UP / PRICE_DOWN /
        PRICE_BOOK_PUBLISH / PRICE_BOOK_ROLLBACK / SPECIAL_PRICE；status 取值：PENDING
        / APPROVED / REJECTED。返回每单的 steps_total / steps_approved / pending_step_no
        / pending_role。
      parameters:
      - description: 变更类型（空=全部）
        in: query
        name: type
        type: string
      - description: 状态（空=全部）
        in: query
        name: status
        type: string
      - description: SKU ID（空=全部）
        in: query
        name: sku_id
        type: integer
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认 20，上限 200）
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 变更单列表（含审批进度摘要）
      tags:
      - 变更单
  /api/internal/change-requests/{id}:
    get:
      description: 前端按 change_request_id 恢复审批状态（价目表发布、官方价变更均适用），不再依赖浏览器缓存。
      parameters:
      - description: change_request.id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=ChangeRequestDetail（含 steps[]）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 变更单不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 变更单详情（含审批步骤链）
      tags:
      - 变更单
  /api/internal/cost/baselines:
    get:
      description: 每行 = 某 SKU 的当前成本基线版本。unit_cost 为代表组件完全成本（input 优先，否则组件字母序）；unit_cost_basis
        标注该组件；floor_price = unit_cost/(1−min_gross_margin)，读 sys_config 失败时该批为 null（读路径降级）。supplier_count
        为当前 EFFECTIVE 报价的去重供应商数，single_point=(count==1)。按 field_mask 剔除敏感键：SALES 剔
        unit_cost/unit_cost_basis/supplier_cost/calc_snapshot，SUPPLIER 另剔 floor_price；buyer（PROCUREMENT）可见全字段。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页（上限 100）
        in: query
        name: size
        type: integer
      - description: sku_code 模糊匹配（大小写不敏感）
        in: query
        name: keyword
        type: string
      - description: 只返回 single_point=true 的行
        in: query
        name: only_single_point
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:V
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 成本基线列表（当前版本，M5:V，无归属过滤）
      tags:
      - 成本管理
  /api/internal/cost/baselines/{sku}/compare:
    get:
      description: 对当前 EFFECTIVE 报价**实时计算**（不走 calc_snapshot——快照受任务消费延迟影响最多 1 分钟，且
        scores 里无 constraints/逐组件成本）。suppliers[] 含逐组件完全成本、constraints 原始值、四因子得分、is_primary/is_backup；range
        实时算（cost_weighted 按四因子 total 加权，Σtotal=0 退化为算术平均）；trend 按天聚合取每日最新版本（Asia/Shanghai
        日历日），不插值；market_best = 参与供应商中完全成本最低值。days 容错规整：<=0→90，>365→365。
      parameters:
      - description: sku_id（纯数字）或 sku_code
        in: path
        name: sku
        required: true
        type: string
      - default: 90
        description: 趋势窗口天数（默认 90，上限 365）
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={sku_id,sku_code,currency,suppliers,range,trend,market_best,market_best_basis}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:V
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 SKU 不存在或当前无 EFFECTIVE 报价
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 多供应商比价 + 成本区间 + 趋势（M5:V）
      tags:
      - 成本管理
  /api/internal/cost/baselines/{sku}/history:
    get:
      description: asOf 为空 = 全量时间线（version DESC，返回 version / valid_from / valid_to
        / change_reason / primary_supplier_id / primary_supplier_name / unit_cost
        / unit_cost_basis / calc_snapshot）；asOf 非空 = 该时刻生效的那一个版本（valid_from<=asOf
        AND (valid_to IS NULL OR valid_to>asOf)，查不到返回 200+空 list）。{sku} 纯数字按 id，否则按
        sku_code；都匹配不到 → 404。calc_snapshot 整体返回（含 formula_version/params/scores/excluded_suppliers），SUPPLIER
        角色整块剔除。
      parameters:
      - description: sku_id（纯数字）或 sku_code
        in: path
        name: sku
        required: true
        type: string
      - description: RFC3339 时刻（如 2026-08-01T00:00:00+08:00）
        in: query
        name: asOf
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list:[…]}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 asOf 非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:V
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 SKU 不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 成本版本历史（M5:V，{sku} 为 sku_id 或 sku_code）
      tags:
      - 成本管理
  /api/internal/cost/baselines/{sku}/lock-primary:
    post:
      consumes:
      - application/json
      description: 覆盖四因子算法结论，新版本 change_reason=MANUAL_LOCK、locked_manual=true。锁定是单向
        sticky：后续任何触发（QUOTE_EFFECTIVE/PARAM_CHANGE/EXPIRE_REMOVE 等）都维持该锁定；若被锁供应商失效（冻结/该
        SKU 无 EFFECTIVE 报价），后续重算明确报错、绝不自动降级或自动解锁。重复锁定同一家供应商 = 合法 no-op（不产新版本、不重复写审计）。本批不含解锁接口（见
        CLAUDE.md 遗留 6d-3-①）。
      parameters:
      - description: sku_id（纯数字）或 sku_code
        in: path
        name: sku
        required: true
        type: string
      - description: 锁定请求（supplier_id 必填，reason 必填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.lockPrimaryBody'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={sku_id,version,primary_supplier_id,change_reason,locked:true,unchanged}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（reason 空白/supplier_id<=0/sku 段为空）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:E（中间件）或角色不含 PROCUREMENT（服务层）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 SKU 或 supplier 不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 该供应商在此 SKU 上无 EFFECTIVE 报价，或供应商处于冻结/失效状态
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 手动锁定主供应商（M5:E + 服务层角色收敛：仅 PROCUREMENT）
      tags:
      - 成本管理
  /api/internal/cost/opportunities:
    get:
      description: type=bargain：主供应商价格显著高于市场最低价的清单（阈值 quote_anomaly_mkt，默认 0.30，严格大于才入选；deviation=(primary−market_best)/market_best）。type=single_point：只有
        1 家有效报价的已上架 SKU（复用 §2 列表的 single_point 语义，不另写查询）。type 缺失或非法 → 400。list 永远是非
        null 数组（空清单是合法事实，前端按 [] 渲染）。
      parameters:
      - description: bargain | single_point
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={type,list,total}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 type 缺失或非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:V
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 议价机会看板 / 单点依赖告警（M5:V）
      tags:
      - 成本管理
  /api/internal/cost/params:
    get:
      description: 返回 defaults（GLOBAL 行）+ overrides[]（MODEL/SUPPLIER 行，按 scope_type,
        scope_id 升序）。所有比率字段都是**数值字符串**，透传 DB numeric(8,4) 入库原字符（含尾零，如 "0.0300"）——前端必须按数值比较（parseFloat/decimal
        比较），**不要按字符串相等比较**（"0.0300" 与 "0.03" 数值同但字符串异）。本批次 defaults 只读（6d-2 遗留项①）。
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={defaults:{loss_rate,channel_rate,tax_inclusive,withholding_tax},overrides:[…]}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:V
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 成本参数读取（M5:V，无归属过滤）
      tags:
      - 成本管理
    put:
      consumes:
      - application/json
      description: 全量替换语义：body.overrides 是替换后的完整覆盖集（[] 合法清空）；事务内 DELETE MODEL/SUPPLIER
        全量 + 逐行 INSERT + 审计 + 逐受影响 SKU 入队 COST_RECALC。body.defaults 本批次只读——传入即 400（绝不静默忽略）；body
        必须带 overrides 键（缺失即 400）。费率必须 0~1、小数位 ≤4、能解析为十进制；scope_id 必须在对应表真实存在；同一 (scope_type,scope_id)
        重复即 400。所有变更**同步触发**受影响 SKU 的成本重算（PARAM_CHANGE）。
      parameters:
      - description: 全量替换请求体（overrides 必填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cost.PutParamsInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={overrides_count,submitted_tasks,task_ids,audit_log_id}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（含 defaults 非空 / overrides 缺失 / scope_type 非
            MODEL/SUPPLIER / scope_id 不存在 / 重复 / 费率非法）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M5:E（中间件）或角色不含 PRICING_OP（服务层）
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 成本参数全量替换（M5:E + 服务层角色收敛：仅 PRICING_OP）
      tags:
      - 成本管理
  /api/internal/customer-quotes:
    post:
      consumes:
      - application/json
      description: APPLY：套用客户 level_code 的当前生效 price_book，items 可省略（全量带出）→ 无生效价目表
        400；CLONE：克隆 source_quote_id 的价格（须同 customer_id，跨客户 409）；TEMP：手工填 items，valid_to
        必填。三类型都做 floor 硬性校验——任一 unit_price < Floor(cost_baseline.unit_cost, min_gross_margin)
        → 409（须走特价审批 §3）。落库 status=DRAFT，version_no=MAX+1（uk_cq_ver 兜底）。
      parameters:
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: customer_id / quote_type 必填；CLONE 需 source_quote_id；TEMP 需 valid_to
          + items
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.generateQuoteBody'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={id,customer_id,version_no,status,quote_type,item_count,below_floor_count,price_book_version,valid_until,owner_sales_operator_id,created_at}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法 / 无生效价目表 / TEMP 缺 valid_to / quote_type 非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M9:E 或客户出数据域
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 客户不存在 / 源报价不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 低于 floor（含 floor_violations[]） / 克隆跨客户
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 生成客户报价（M9:E + 幂等必填 Idempotency-Key；quote_type=APPLY/CLONE/TEMP）
      tags:
      - 客户报价
  /api/internal/customer-quotes/{id}/export:
    get:
      description: TEMP 报价且未过期（valid_until >= now）才能导出，文件含水印「临时报价，有效期至 X，仅限 Y 使用」。其余类型（APPLY/CLONE/SPECIAL/CONTRACT）不带水印。过期
        → 409。
      parameters:
      - description: customer_quote.id
        in: path
        name: id
        required: true
        type: integer
      - default: xlsx
        description: 格式：xlsx（本批仅支持）
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'XLSX 文件流；Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet；Content-Disposition:
            attachment; filename=\"customer_quote_<id>.xlsx\'
          schema:
            type: file
        "400":
          description: code=10001 参数非法 / format 不支持
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M9:V
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 报价不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 TEMP 报价已过期
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 导出客户报价（M9:V；直返 XLSX 文件流，不是统一响应信封；本批仅支持 format=xlsx，PDF 登记 9b-② 遗留）
      tags:
      - 客户报价
  /api/internal/customer-quotes/{id}/refresh:
    post:
      consumes:
      - application/json
      description: 按最新成本基线重算 floor_price；unit_price 不动。floor_price 变了才生成新版本（version_no+1，旧版本
        EXPIRED）；值未变则 unchanged=true 且不产生新版本（changed_items=[]）。状态可刷新仅限 DRAFT/PENDING。
      parameters:
      - description: customer_quote.id
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: reason 可选
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.refreshBody'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=RefreshResult{quote_id, old_version_no, new_version_no,
            changed_items[], unchanged, status}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M9:E
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 报价不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 报价态不可刷新（APPROVED/EFFECTIVE/EXPIRED/REJECTED）
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 刷新客户报价（M9:E + 幂等必填 Idempotency-Key）
      tags:
      - 客户报价
  /api/internal/customer-quotes/{id}/special-price:
    post:
      consumes:
      - application/json
      description: 把 DRAFT 客户报价标记为「特价审批中」：change_request[SPECIAL_PRICE] + 2 步 approval_step（PRICING_OP
        → FINANCE，biz_type=change_type）+ customer_quote.special_price_status='PENDING'。margin_impact={current_price,current_margin,target_price,target_margin,delta_gap_distance}
        预演（裁决 2）。重复申请（special_price_status=PENDING）→ 409。
      parameters:
      - description: customer_quote.id
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: reason / expected_margin 必填
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.specialPriceBody'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=SpecialPriceResult{quote_id, change_request_id,
            step_count, status, margin_impact}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（缺 reason/expected_margin、expected_margin 非
            decimal）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M9:E
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 报价不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 报价非 DRAFT / 已在特价审批中（special_price_status=PENDING）
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 申请特价（M9:E + 幂等必填 Idempotency-Key）
      tags:
      - 客户报价
  /api/internal/customers:
    get:
      description: 返回 customer_profile + legal_subject.legal_name + internal_staff.name
        联表。keyword 按 legal_name ILIKE 搜索。行级过滤按 owner_sales_operator_id（销售归属），与 supplier.applyOwnerScope
        同形态。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页（上限 200）
        in: query
        name: size
        type: integer
      - description: 按 legal_name ILIKE 搜索
        in: query
        name: keyword
        type: string
      produces:
      - application/json
