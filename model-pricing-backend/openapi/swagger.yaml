          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 无 M4:E
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
