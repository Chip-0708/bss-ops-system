        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.transferBody'
      produces:
      - application/json
      responses:
        "200":
          description: confirm=false：data=TransferImpact；confirm=true：data=TransferResult
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法 / 目标销售非法 / 缺 confirm
          schema:
