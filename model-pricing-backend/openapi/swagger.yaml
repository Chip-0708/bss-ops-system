          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 账号或密码错误
          schema:
            $ref: '#/definitions/api.APIResponse'
        "423":
          description: code=10006 主体已冻结
          schema:
            $ref: '#/definitions/api.APIResponse'
        "429":
          description: code=10007 失败次数超限，锁定 15 分钟
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: 登录（三门户共用，portal 由路由前缀决定）
      tags:
      - 认证
  /api/supplier/auth/logout:
    post:
      consumes:
      - application/json
      description: 按 Authorization 头中的 Bearer token 吊销会话（revoked=true）。成功返回 204 无响应体。
      produces:
      - application/json
      responses:
        "204":
          description: 会话已吊销
        "401":
          description: code=10002 未携带或非法 token
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 登出（吊销当前会话）
      tags:
      - 认证
  /api/supplier/model-applications:
    get:
      description: 行级过滤：仅返回本供应商主体的申请。支持 status 筛选（SUBMITTED/MERGED/APPROVED/REJECTED）。
      parameters:
      - description: 状态筛选（空=全部）
        in: query
        name: status
        type: string
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认 20，上限 200）
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 我的模型申请列表
      tags:
      - 供应商-新模型申请
    post:
      consumes:
      - application/json
      description: 供应商提交拟引入的新模型。payload 为自由结构（能力/上下文/模态/期望定价等）。提交时按 model_name 与已有
        SKU 做相似度查重，结果落在 dup_top3 供内部审核参考（只提示不拦截）。
      parameters:
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: '{model_name, vendor_id?, payload}'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/supplier.SubmitApplicationInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=ModelApplication（status=SUBMITTED）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法（model_name/payload 缺失或非 JSON 对象）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: code=10003 非供应商主体
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 提交新模型申请
      tags:
      - 供应商-新模型申请
  /api/supplier/quotes:
    post:
      consumes:
      - application/json
      description: 必须携带 Idempotency-Key。校验顺序按 05-quotes.md §3 九步：items 非空/≤500 行/SKU
        不重复且在可报价集合内 → 过去时间静默钳制（响应 clamped:true）→ valid_to>valid_from → 币种锁定 → 汇率档位（USD
        必填 8 档，CNY 传了置 null）→ 倍率-价格自洽复核（容差 1e-4，无官方价强制绝对价）→ 非终态互斥（409）→ 未知 component_type/constraints
        key 拒绝。落库单事务：quote_sheet(APPROVING, version_no=max+1) + items + components
        + todo_task + audit_log。
      parameters:
      - description: 幂等键（客户端生成唯一串）
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 报价单（valid_from/valid_to/items 必填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/supplier.SubmitQuoteInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={id,supplier_id,version_no,status,valid_from,valid_to,source,retroactive,clamped,item_count,submitted_at}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 校验失败（message 可直接展示）/ 同幂等键异 body
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 供应商档案不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 已存在审批中/待生效报价（非终态互斥）或幂等冲突
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 提交报价（幂等、双向自洽复核、钳制生效时间）
      tags:
      - 供应商门户
  /api/supplier/quotes/{id}:
    get:
      description: 越权（不是自己的报价单）返回 404（不返回 403，避免探测他人 ID）。响应含报价单头 + items[]（sku_code/model_name/currency/fx_tier/constraints/components[]）+
        decision。不含官方价以外任何成本信息。
      parameters:
      - description: 报价单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=报价详情
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 id 非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 报价单不存在或不属于当前供应商
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 报价详情
      tags:
      - 供应商门户
  /api/supplier/quotes/history:
    get:
      description: 只返回登录主体自己的报价（服务层按 supplier_id 硬过滤，不接受入参指定）；含被覆盖/过期/驳回的全部历史版本。不含任何他人报价/平台售价/毛利。decision.result
        取值 APPROVED/REJECTED，未审批为 null；驳回原因供应商可见。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      - description: 状态筛选（§1 状态字典）
        in: query
        name: status
        type: string
      - description: SKU 筛选
        in: query
        name: sku_id
        type: integer
      - description: 生效时间下限（ISO 8601）
        in: query
        name: from
        type: string
      - description: 生效时间上限（ISO 8601）
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 时间参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 供应商档案不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 报价历史（含审批结论）
      tags:
      - 供应商门户
  /api/supplier/quotes/import/confirm:
    post:
      consumes:
      - application/json
      description: 请求体与手工提交 §3 同构（valid_from/valid_to/remark/items[]）；与 §3 共用同一套九步校验（不信任前端，全量重校验）。不做「必须是
        preview_items 的 sku 子集」校验（技术上无法闭环，属前端纪律）。落库 source='IMPORT'，审计 QUOTE_IMPORT，同样进入
        APPROVING + todo_task。
      parameters:
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 报价单（valid_from/valid_to/items 必填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/supplier.SubmitQuoteInput'
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data 同 §3 提交报价
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 校验失败（message 可直接展示）
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: code=10005 非终态互斥 / 幂等冲突
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 确认导入（幂等，不跳过审批）
      tags:
      - 供应商门户
  /api/supplier/quotes/import/preview:
    post:
      consumes:
      - multipart/form-data
      description: 逐行校验（SKU 命中/币种锁定/汇率档位/四种填法），返回 OK/WARN/ERROR 与 preview_items（只含
        OK+WARN）。ERROR 行不得入库。confirm 时前端把修正后的行整体回传，服务端重新全量校验（不信任前端）。行号从 2 开始（1=表头）。
      parameters:
      - description: CSV 文件（≤2MB，≤500 行）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={token,total,ok_count,warn_count,error_count,rows,preview_items}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 文件超限 / 行数超限 / CSV 格式非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 上传校验预览（不落库）
      tags:
      - 供应商门户
  /api/supplier/quotes/template:
    get:
      description: 列按可报价 SKU 的官方价组件并集动态生成（official_/multiplier_/price_ × N 组件）；valid_from/valid_to
        不在 CSV 里（由 confirm 请求体传入），last_valid_to 为该 SKU 上次报价到期日只读参考。绝不含他人报价/平台成本/毛利。?format=xlsx
        预留但本阶段返回 400。
      parameters:
      - description: history / vendor / family / active（默认）
        in: query
        name: scope
        type: string
      - description: scope=vendor 时必填
        in: query
        name: vendor_id
        type: integer
      - description: scope=family 时必填
        in: query
        name: family_id
        type: integer
      - description: csv（默认）/ xlsx（预留，返回 400）
        in: query
        name: format
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV 文件（带 BOM）
          schema:
            type: string
        "400":
          description: code=10001 format=xlsx 暂未开放
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 供应商档案不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 下载导入模板（CSV，UTF-8 带 BOM）
      tags:
      - 供应商门户
  /api/supplier/skus:
    get:
      description: 返回 lifecycle_status ∈ (PUBLISHED, PURCHASABLE, PENDING_VERIFY)
        的 SKU，含官方价基准只读列。不含他人报价/平台成本/毛利。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      - description: 关键字
        in: query
        name: keyword
        type: string
      - description: 厂商筛选
        in: query
        name: vendor_id
        type: integer
      - description: 系列筛选
        in: query
        name: family_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data={list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: code=10001 参数非法
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: code=10004 供应商档案不存在
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 供应商可报价 SKU 列表
      tags:
      - 供应商门户
  /healthz:
    get:
      description: 实际 Ping 数据库。200 {"status":"ok","db":"up"}；503 {"status":"degraded","db":"down"}。
      produces:
      - application/json
      responses:
        "200":
          description: status=ok, db=up
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: status=degraded, db=down
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查（运维探针，不走统一响应包）
      tags:
      - 运维
  /internal/alerts:
    get:
      parameters:
      - description: 严重级别（CRITICAL/HIGH/MID/LOW）
        in: query
        name: severity
        type: string
      - description: 状态（OPEN/HANDLING/RESOLVED/IGNORED）
        in: query
        name: status
        type: string
      - description: 告警类型（QUOTE_EXPIRE/QUOTE_ANOMALY/RETRO_LIMIT）
        in: query
        name: alert_type
        type: string
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认 20，最大 100）
        in: query
        name: size
        type: integer
      responses:
        "200":
          description: code=0；data=AlertListResult{list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 告警列表
      tags:
      - workbench
    post:
      parameters:
      - description: 处理动作
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/workbench.AlertActionInput'
      responses:
        "200":
          description: code=0；data=AlertActionResult{alert_id,status,todo_id}
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 告警处理
      tags:
      - workbench
  /internal/audit-logs:
    get:
      parameters:
      - description: 动作（如 CUSTOMER_QUOTE_ACCEPTED）
        in: query
        name: action
        type: string
      - description: 目标类型（如 CUSTOMER_QUOTE）
        in: query
        name: target_type
        type: string
      - description: 目标 ID
        in: query
        name: target_id
        type: integer
      - description: 操作员 ID
        in: query
        name: operator_id
        type: integer
      - description: 操作员角色
        in: query
        name: operator_role
        type: string
      - description: 来源类型（INTERNAL/WORKER/SYSTEM）
        in: query
        name: source_type
        type: string
      - description: 起始时间（RFC3339，左闭）
        in: query
        name: from
        type: string
      - description: 结束时间（RFC3339，右开）
        in: query
        name: to
        type: string
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认 20，最大 100）
        in: query
        name: size
        type: integer
      responses:
        "200":
          description: code=0；data=AuditListResult{items,total}
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - workbench
  /internal/audit-logs/export:
    get:
      parameters:
      - description: 格式（csv/xlsx）
        in: query
        name: format
        required: true
        type: string
      - description: 起始时间（RFC3339，左闭）
        in: query
        name: from
        required: true
        type: string
      - description: 结束时间（RFC3339，右开）
        in: query
        name: to
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 导出审计日志
      tags:
      - workbench
securityDefinitions:
  BearerAuth:
    description: Bearer <token>，登录后获得
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
