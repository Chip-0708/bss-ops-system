      summary: 特权补录（RETRO_OP，幂等，免审批）
      tags:
      - 报价审批
  /api/internal/quotes/scan:
    post:
      description: type=expire：到期前 T-7/T-3 生成 todo+alert（去重）；type=expire-final：兜底处理
        remove_confirmed=true 仍未剔除的历史遗留（正常查不到行）；type=anomaly：异常检测写 alert。均不挂幂等（扫描语义，靠去重保证可重复执行）。
      parameters:
