    post:
      consumes:
      - application/json
      description: 首次 confirm=false 返回影响面（from/to 销售名、随迁报价数、专属价目表行数）；二次 confirm=true
        才执行：单事务 UPDATE customer_profile.owner_sales_operator_id + UPDATE customer_quote.owner_sales_operator_id（随迁）+
        UPDATE customer_quote.origin_owner_id（留档，NULL 才填）+ audit_log。目标必须是 ACTIVE
        + 持 SALES 角色的 staff；移交目标是当前归属 → 409 no-op；非主管 → 403。
      parameters:
      - description: customer_profile.id
        in: path
        name: id
        required: true
        type: integer
      - description: 幂等键
        in: header
        name: Idempotency-Key
        required: true
        type: string
