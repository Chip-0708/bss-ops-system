    get:
      description: 已认证即可；采购/销售/定价/财务看自己的待办（assignee_id=operator_id），PLATFORM_ADMIN
        看全部。按 (biz_type,biz_id,priority) 去重。deeplink 按 biz_type 生成。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页
        in: query
        name: size
        type: integer
      - description: 业务类型（QUOTE / QUOTE_EXPIRE）
        in: query
        name: biz_type
        type: string
      - description: 状态（OPEN / DONE）
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code=0；data=TodoListResult{list,total,page,size}
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: code=10002 未认证
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: 工作台待办聚合（按角色裁剪）
      tags:
      - 工作台
  /api/open/aliases:
    get:
